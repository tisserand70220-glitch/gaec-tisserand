<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pointage — Gaec Tisserand</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--nuit:#2b1220;--cerise:#c8323c;--cerise2:#e8505b;--or:#e9b95c;--creme:#fbf6ee}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:Manrope,system-ui,sans-serif;color:var(--creme);background:var(--nuit);-webkit-font-smoothing:antialiased}
  .ecran{display:none;min-height:100dvh;padding:calc(24px + env(safe-area-inset-top)) 26px calc(22px + env(safe-area-inset-bottom));flex-direction:column}
  .ecran.actif{display:flex}
  .serif{font-family:Fraunces,Georgia,serif}
  /* connexion */
  #login{background:var(--nuit);justify-content:center}
  #login .logo{width:110px;margin:0 auto 26px;display:block;opacity:.85}
  #login h1{font-family:Fraunces,serif;font-size:32px;font-weight:700;margin:0 0 4px;text-align:center}
  #login p{text-align:center;opacity:.7;margin:0 0 30px;font-size:15px}
  #login input{width:100%;padding:16px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:#fff;font:inherit;font-size:17px;margin-bottom:12px}
  #login button{width:100%;padding:18px;border:0;border-radius:14px;background:var(--cerise);color:#fff;font:inherit;font-size:18px;font-weight:800;margin-top:8px}
  #login .err{color:var(--or);text-align:center;font-size:14px;min-height:20px;margin-top:12px}
  /* principal */
  #main{background:radial-gradient(120% 60% at 50% -10%,#6a1f33 0%,var(--nuit) 60%)}
  #main .logo{width:80px;margin-bottom:10px;opacity:.85}
  .date{font-size:15px;opacity:.7;font-weight:500}
  .titre{font-family:Fraunces,serif;font-size:34px;font-weight:700;line-height:1.05;margin-top:6px}
  .titre em{font-style:italic;color:var(--or)}
  .ilest{margin-top:16px;font-size:14px;opacity:.7}
  .heure{font-family:Fraunces,serif;font-size:64px;font-weight:500;line-height:1;letter-spacing:-2px;margin-top:2px}
  .carte{margin-top:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:4px 20px}
  .carte .l{display:flex;align-items:center;justify-content:space-between;padding:12px 0;font-size:16px}
  .carte .l + .l{border-top:1px solid rgba(255,255,255,.1)}
  .carte .l b{font-family:Fraunces,serif;font-size:26px;font-weight:600}
  .carte .l .vide{opacity:.4}
  .carte .l .plage{font-family:Fraunces,serif;font-size:22px;font-weight:600;white-space:nowrap}
  .carte .l .plage i{font-style:normal;opacity:.45;margin:0 4px}
  .carte .l.total span{opacity:.75}
  .carte .l.total b{color:var(--or)}
  .oublis{margin-top:14px;background:rgba(233,185,92,.14);border:1px solid rgba(233,185,92,.5);border-radius:16px;padding:12px 16px;font-size:14px;line-height:1.45}
  .oublis b{color:var(--or);display:block;margin-bottom:4px;font-size:15px}
  .oublis:empty{display:none}
  #confirm .oubli{margin-top:18px;background:rgba(0,0,0,.22);border-radius:14px;padding:12px 16px;font-size:15px;line-height:1.4;max-width:320px}
  #confirm .oubli:empty{display:none}
  .encours{margin-top:10px;font-size:14px;color:var(--or);font-weight:600;min-height:18px}
  .puce{position:relative;display:block;margin:18px auto 0;width:120px;height:120px;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .puce:active .coeur{transform:scale(.94)}
  .aide b{color:var(--creme);opacity:1}
  /* scanner */
  #scan{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center}
  #scan.ouvert{display:flex}
  #scan video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
  #scan .viseur{position:relative;width:240px;height:240px;border:3px solid var(--or);border-radius:24px;box-shadow:0 0 0 2000px rgba(0,0,0,.45)}
  #scan .msg{position:absolute;top:calc(40px + env(safe-area-inset-top));left:20px;right:20px;text-align:center;font-size:17px;font-weight:700}
  #scan .fermer{position:absolute;bottom:calc(36px + env(safe-area-inset-bottom));padding:14px 28px;border-radius:999px;border:0;background:var(--creme);color:var(--nuit);font:inherit;font-size:16px;font-weight:800}
  .puce .c{position:absolute;inset:0;border-radius:50%;border:2px solid var(--cerise2);opacity:.35;animation:onde 2.6s ease-out infinite}
  .puce .c:nth-child(2){animation-delay:.9s}.puce .c:nth-child(3){animation-delay:1.8s}
  @keyframes onde{0%{transform:scale(.55);opacity:.6}100%{transform:scale(1.15);opacity:0}}
  @media(prefers-reduced-motion:reduce){.puce .c{animation:none;transform:scale(.9)}}
  .puce .coeur{position:absolute;inset:28px;border-radius:50%;background:var(--cerise);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px rgba(200,50,60,.5)}
  .aide{text-align:center;font-size:13px;opacity:.7;margin-top:8px;line-height:1.4}
  .bas{margin-top:auto;padding-top:14px;display:flex;justify-content:space-between;font-size:13px;opacity:.75}
  .bas b{display:block;font-size:20px;font-family:Fraunces,serif;font-weight:600}
  .deco{position:absolute;top:calc(24px + env(safe-area-inset-top));right:22px;font-size:12px;opacity:.5;background:none;border:0;color:inherit;font:inherit}
  /* confirmation */
  #confirm{background:var(--cerise);align-items:center;justify-content:center;text-align:center}
  #confirm.deja{background:#7a3a10}
  #confirm .coche{width:104px;height:104px;border-radius:50%;background:#fff;color:var(--cerise);font-size:56px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-bottom:30px;box-shadow:0 20px 40px rgba(0,0,0,.2)}
  #confirm h2{margin:0;font-family:Fraunces,serif;font-size:36px;font-weight:700;line-height:1.05}
  #confirm .h{font-family:Fraunces,serif;font-size:84px;font-weight:500;letter-spacing:-2px;line-height:1;margin:22px 0 10px}
  #confirm p{font-size:17px;opacity:.85;margin:0;line-height:1.5}
  #confirm .logo{width:110px;margin-top:34px;opacity:.9}
  /* erreur */
  #erreur{justify-content:center;text-align:center}
  #erreur h2{font-family:Fraunces,serif;font-size:28px}
  #erreur p{opacity:.75;line-height:1.5}
  #erreur button{margin-top:20px;padding:14px 24px;border:1px solid rgba(255,255,255,.3);background:none;color:#fff;border-radius:12px;font:inherit;font-weight:700}
</style>
</head>

function duree(min){ const h = Math.floor(min/60), m = min%60; return m ? `${h} h ${String(m).padStart(2,'0')}` : `${h} h`; }
function cleJour(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function debutMois(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function debutSemaine(d){ const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; }
function erreur(titre, texte){ $('errTitre').textContent = titre; $('errTexte').textContent = texte; ecran('erreur'); }

// ----- Matin / après-midi -----
const PIVOT_H = 13;              // une arrivée avant 13 h compte pour le matin, sinon pour l'après-midi
const NOUVELLE_PERIODE_H = 15;   // arrivée du matin encore ouverte après 15 h = départ du matin oublié
const NOM = { matin: 'matin', aprem: 'après-midi' };
const DU = { matin: 'du matin', aprem: 'de l\'après-midi' };
function periodeDe(d){ return d.getHours() < PIVOT_H ? 'matin' : 'aprem'; }

// Découpe une journée en matin / après-midi, calcule les minutes et repère les oublis
function analyseJour(es, estAujourdhui, now = new Date()){
  const p = { matin: { arr: null, dep: null, min: 0 }, aprem: { arr: null, dep: null, min: 0 } };
  const ano = []; let ouvert = null, enCours = null;
  for (const e of es) {
    if (e.type === 'arrivee') {
      if (ouvert) ano.push({ per: ouvert.per, txt: 'départ ' + DU[ouvert.per] + ' non pointé' });
      const per = periodeDe(e.date);
      if (!p[per].arr) p[per].arr = e;
      ouvert = { e, per };
    } else if (!ouvert) {
      const per = periodeDe(e.date);
      ano.push({ per, txt: 'arrivée ' + DU[per] + ' non pointée' });
      p[per].dep = e;
    } else {
      p[ouvert.per].dep = e; p[ouvert.per].min += Math.round((e.date - ouvert.e.date)/60000); ouvert = null;
    }
  }
  if (ouvert) {
    if (estAujourdhui && (ouvert.per === 'aprem' || now.getHours() < NOUVELLE_PERIODE_H)) { enCours = ouvert.per; p[ouvert.per].min += Math.round((now - ouvert.e.date)/60000); }
    else ano.push({ per: ouvert.per, txt: 'départ ' + DU[ouvert.per] + ' non pointé' });
  }
  return { p, minutes: p.matin.min + p.aprem.min, enCours, ano };
}

function parJour(liste){ const j = {}; for (const e of liste) (j[cleJour(e.date)] ||= []).push(e); return j; }
function plage(per, enCours){
  if (!per.arr && !per.dep) return '<span class="vide">—</span>';
  return (per.arr ? hm(per.arr.date) : '?') + '<i>→</i>' + (per.dep ? hm(per.dep.date) : (enCours ? '<span style="color:var(--or)">en cours</span>' : '?'));
}

function afficher(){
  const now = new Date();
  $('date').textContent = JOURS[now.getDay()].replace(/^./, c => c.toUpperCase()) + ' ' + now.getDate() + ' ' + MOIS[now.getMonth()];
  $('heure').textContent = hm(now);
  const jours = parJour(entrees), kAuj = cleJour(now);
  const a = analyseJour(jours[kAuj] || [], true, now);
  $('pMatin').innerHTML = plage(a.p.matin, a.enCours === 'matin');
  $('pAprem').innerHTML = plage(a.p.aprem, a.enCours === 'aprem');
  $('totJour').textContent = duree(a.minutes);
  $('encours').textContent = a.enCours ? 'Tu es pointée depuis ' + hm(a.p[a.enCours].arr.date) : '';
  // Totaux semaine / mois et oublis des 7 derniers jours
  const kSem = cleJour(debutSemaine(now)), kMois = cleJour(debutMois(now));
  const k7 = cleJour(new Date(now.getFullYear(), now.getMonth(), now.getDate() - 7));
  let sem = 0, mois = 0; const oublis = [];
  for (const k of Object.keys(jours).sort()) {
    const j = k === kAuj ? a : analyseJour(jours[k], false, now);
    if (k >= kMois) mois += j.minutes;
    if (k >= kSem) sem += j.minutes;
    if (k >= k7) for (const o of j.ano) oublis.push(jourTexte(k, kAuj) + ' : ' + o.txt);
  }
  $('semaine').textContent = duree(sem); $('mois').textContent = duree(mois);
  $('oublis').innerHTML = oublis.length ? '<b>Pointage oublié</b>' + oublis.join('<br>') + '<br><span style="opacity:.75">Préviens la gestion pour le faire corriger.</span>' : '';
}

function jourTexte(k, kAuj){
  if (k === kAuj) return 'Aujourd\'hui';
  const d = new Date(k + 'T12:00:00'), hier = new Date(); hier.setDate(hier.getDate() - 1);
  if (k === cleJour(hier)) return 'Hier';
  return JOURS[d.getDay()].replace(/^./, c => c.toUpperCase()) + ' ' + d.getDate();
}

function ecouter(){
  if (unsub) unsub();
  const n = new Date(), sept = new Date(n.getFullYear(), n.getMonth(), n.getDate() - 7);
  const debut = new Date(Math.min(debutMois(n), sept));   // mois en cours + 7 derniers jours pour les oublis
  unsub = db.collection('pointage').where('horodatage', '>=', debut).orderBy('horodatage')
    .onSnapshot(snap => {
      entrees = snap.docs.map(d => d.data()).filter(x => x.uid === user.uid && x.horodatage)
        .map(x => ({ type: x.type, date: x.horodatage.toDate() }));
      afficher();
    }, err => erreur('Lecture impossible', err.message));
}

// Pointage déclenché par le scan du QR code (URL avec ?nfc)
async function pointer(){
  history.replaceState(null, '', location.pathname);   // évite un nouveau pointage si la page se recharge
  const j0 = new Date(); j0.setHours(0,0,0,0);
  const snap = await db.collection('pointage').where('horodatage', '>=', j0).orderBy('horodatage').get();
  const auj = snap.docs.map(d => d.data()).filter(x => x.uid === user.uid && x.horodatage);
  const dernier = auj[auj.length - 1];
  const now = new Date();
  if (dernier && (now - dernier.horodatage.toDate())/1000 < ANTI_DOUBLE_SEC) {
    confirmation(dernier.type, dernier.horodatage.toDate(), true, ''); return;
  }
  // Arrivée encore ouverte : c'est un départ, sauf si c'est celle du matin et qu'on est l'après-midi (départ du matin oublié)
  let type = 'arrivee', oubli = '';
  if (dernier && dernier.type === 'arrivee') {
    const perOuverte = periodeDe(dernier.horodatage.toDate());
    if (perOuverte === 'aprem' || now.getHours() < NOUVELLE_PERIODE_H) type = 'depart';
    else oubli = 'Attention : ton départ de ce matin n\'a pas été pointé. Préviens la gestion pour le faire corriger.';
  }
  await db.collection('pointage').add({ uid: user.uid, type, source: 'nfc', horodatage: firebase.firestore.FieldValue.serverTimestamp() });
  confirmation(type, now, false, oubli);
}

function confirmation(type, d, deja, oubli){
  $('confTitre').innerHTML = (type === 'arrivee' ? 'Arrivée' : 'Départ') + '<br>' + (deja ? 'déjà enregistré' + (type === 'arrivee' ? 'e' : '') : 'enregistré' + (type === 'arrivee' ? 'e' : ''));
  $('confHeure').textContent = hm(d);
  $('confTexte').innerHTML = JOURS[d.getDay()].replace(/^./, c => c.toUpperCase()) + ' ' + d.getDate() + ' ' + MOIS[d.getMonth()] + '<br>' + (type === 'arrivee' ? 'Bonne journée ' : 'À bientôt ') + (prenom || '');
  $('confOubli').textContent = oubli || '';
  $('confirm').classList.toggle('deja', deja || !!oubli);
  ecran('confirm');
  if (navigator.vibrate) navigator.vibrate(deja || oubli ? [80,60,80] : 120);
  setTimeout(() => ecran('main'), oubli ? 9000 : 5000);
}

async function demarrer(u){
  user = u;
  try {
    const acces = await db.collection('pointage_acces').doc(u.uid).get();
    if (!acces.exists || acces.data().role !== 'salariee') { erreur('Compte non autorisé', 'Ce compte n\'est pas celui de la salariée. Déconnecte-toi et reconnecte-toi avec le bon compte.'); auth.signOut(); return; }
    ecran('main');
    ecouter();
    if (nfcDemande) await pointer();
  } catch (e) { erreur('Connexion à la base impossible', e.message); }
}

$('btnLogin').onclick = async () => {
  $('loginErr').textContent = '';
  try { await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); await auth.signInWithEmailAndPassword($('email').value.trim(), $('mdp').value); }
  catch (e) { $('loginErr').textContent = 'Mot de passe incorrect'; }
};
$('mdp').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnLogin').click(); });
$('btnDeco').onclick = () => { if (confirm('Te déconnecter ? Il faudra ressaisir le mot de passe pour pointer.')) auth.signOut(); };

// ----- Scanner intégré : lit le QR de l'entrée avec la caméra -----
let flux = null, boucle = null;
const toile = document.createElement('canvas'), ctx = toile.getContext('2d', { willReadFrequently: true });
function estQrPointage(t){ try { const u = new URL(t); return u.pathname.endsWith('/pointage.html') && u.searchParams.has('nfc'); } catch(e){ return false; } }
function fermerScan(){
  if (boucle) cancelAnimationFrame(boucle); boucle = null;
  if (flux) flux.getTracks().forEach(t => t.stop()); flux = null;
  $('scan').classList.remove('ouvert');
}
async function ouvrirScan(){
  $('scanMsg').textContent = 'Vise le QR code de l’entrée';
  $('scan').classList.add('ouvert');
  try {
    flux = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
  } catch (e) {
    $('scanMsg').textContent = 'Caméra refusée. Autorise la caméra pour cette page dans les réglages du téléphone, ou scanne le QR avec l’appareil photo.';
    return;
  }
  const v = $('video'); v.srcObject = flux; await v.play().catch(() => null);
  const lire = () => {
    if (!flux) return;
    if (v.readyState >= 2 && window.jsQR) {
      const w = toile.width = v.videoWidth, h = toile.height = v.videoHeight;
      ctx.drawImage(v, 0, 0, w, h);
      const r = jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' });
      if (r && r.data) {
        if (estQrPointage(r.data)) { fermerScan(); ecran('main'); pointer().catch(err => erreur('Pointage impossible', err.message)); return; }
        $('scanMsg').textContent = 'Ce n’est pas le QR code de pointage';
      }
    }
    boucle = requestAnimationFrame(lire);
  };
  lire();
}
$('btnScan').onclick = ouvrirScan;
$('btnFermer').onclick = fermerScan;

auth.onAuthStateChanged(u => { if (u) demarrer(u); else { if (unsub) unsub(); user = null; ecran('login'); } });
setInterval(() => { if (user) afficher(); }, 30000);
</script>
