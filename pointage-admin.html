<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pointage — Gestion — Gaec Tisserand</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--nuit:#2b1220;--cerise:#c8323c;--or:#e9b95c;--creme:#fbf6ee;--encre:#2a1c22;--gris:#7c6f74;--ligne:#eadfd8;--alerte:#d0641c;--vert:#2f6b4f}
  *{box-sizing:border-box}
  body{margin:0;font-family:Manrope,system-ui,sans-serif;color:var(--encre);background:var(--creme);min-height:100vh}
  .serif{font-family:Fraunces,Georgia,serif}
  button{font:inherit;cursor:pointer}
  /* connexion */
  #login{display:none;min-height:100vh;align-items:center;justify-content:center;background:var(--nuit);color:var(--creme)}
  #login form{width:360px;padding:20px}
  #login .logo{width:120px;display:block;margin:0 auto 20px;opacity:.85}
  #login h1{font-family:Fraunces,serif;font-size:30px;margin:0;text-align:center}
  #login p{text-align:center;opacity:.7;margin:4px 0 28px}
  #login input{width:100%;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:#fff;font:inherit;font-size:16px;margin-bottom:12px}
  #login button{width:100%;padding:16px;border:0;border-radius:12px;background:var(--cerise);color:#fff;font-size:17px;font-weight:800;margin-top:6px}
  #login .err{color:var(--or);text-align:center;font-size:14px;min-height:20px;margin-top:10px}
  /* app */
  #app{display:none;grid-template-columns:230px 1fr;min-height:100vh}
  aside{background:var(--nuit);color:var(--creme);padding:28px 22px;display:flex;flex-direction:column;gap:26px}
  aside .logo{width:120px;display:block;opacity:.9}
  .marque{font-family:Fraunces,serif;font-size:24px;font-weight:700;line-height:1.05}
  .marque em{font-style:italic;color:var(--or)}
  .sal{border-top:1px solid rgba(255,255,255,.12);padding-top:18px}
  .sal b{font-size:18px;display:block}
  .sal small{font-size:12px;opacity:.6}
  .menu{display:flex;flex-direction:column;gap:4px;font-size:15px}
  .menu button{text-align:left;padding:10px 12px;border-radius:10px;border:0;background:none;color:inherit;opacity:.7}
  .menu button.actif{background:var(--cerise);opacity:1;font-weight:700}
  aside .deco{margin-top:auto;font-size:12px;opacity:.5;background:none;border:0;color:inherit;text-align:left;padding:0}
  main{padding:28px 32px;max-width:1100px}
  .mois{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .mois b{font-family:Fraunces,serif;font-size:30px;font-weight:700;min-width:250px}
  .mois .nav{background:none;border:0;color:var(--gris);font-size:26px;padding:0 8px}
  .actions{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
  .actions button{padding:10px 16px;border:1.5px solid var(--encre);background:transparent;color:var(--encre);border-radius:999px;font-weight:700;font-size:14px}
  .actions button.plein{background:var(--cerise);border-color:var(--cerise);color:#fff}
  .kpis{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:14px;margin-top:22px}
  .kpi{background:#fff;border-radius:18px;padding:18px 20px;border:1px solid var(--ligne)}
  .kpi.grand{background:var(--nuit);color:var(--creme);border:0}
  .kpi .g{font-family:Fraunces,serif;font-size:38px;font-weight:600;line-height:1;letter-spacing:-1px}
  .kpi.grand .g{font-size:50px;color:var(--or)}
  .kpi .p{font-size:13px;color:var(--gris);margin-top:8px}
  .kpi.grand .p{color:var(--creme);opacity:.7}
  .kpi.grand .barre{height:6px;background:rgba(255,255,255,.15);border-radius:3px;margin-top:16px;overflow:hidden}
  .kpi.grand .barre i{display:block;height:100%;width:0;background:var(--or);border-radius:3px;transition:width .4s}
  .kpi.al{border-color:var(--alerte)}.kpi.al .g{color:var(--alerte)}
  .alerte{margin-top:16px;background:#fdeee2;border-radius:12px;padding:12px 16px;font-size:14px;color:#7a3a10;display:flex;gap:10px;align-items:center;cursor:pointer}
  .alerte i{width:8px;height:8px;border-radius:50%;background:var(--alerte);flex:none}
  .liste{margin-top:16px;background:#fff;border:1px solid var(--ligne);border-radius:18px;overflow:hidden}
  .r{display:grid;grid-template-columns:110px 150px 150px 100px 1fr;padding:12px 20px;font-size:15px;align-items:center}
  .r .pl i{font-style:normal;color:var(--gris);margin:0 3px}
  .r .pl .manque{color:var(--alerte);font-weight:700}
  .r + .r{border-top:1px solid var(--ligne)}
  .r.tete{background:#f6efe8;color:var(--gris);font-size:12px;font-weight:700}
  .r:not(.tete):hover{background:#fdf9f3;cursor:pointer}
  .r .tot{font-family:Fraunces,serif;font-weight:600;font-size:17px}
  .r .corr{color:var(--alerte);font-size:13px}
  .r .we,.r .we *{color:var(--gris)}
  .r .info{color:var(--gris);font-size:13px}
  /* réglages */
  #reglages{display:none;max-width:480px}
  #reglages label{display:block;font-size:13px;color:var(--gris);margin:16px 0 6px}
  #reglages input{width:100%;padding:12px;border:1px solid var(--ligne);border-radius:10px;font:inherit;font-size:16px;background:#fff}
  #reglages button{margin-top:20px;padding:12px 20px;border:0;border-radius:999px;background:var(--cerise);color:#fff;font-weight:700}
  #reglages .msg{font-size:13px;color:var(--vert);margin-top:10px;min-height:18px}
  /* modale */
  #voile{display:none;position:fixed;inset:0;background:rgba(43,18,32,.55);align-items:center;justify-content:center;padding:20px;z-index:10}
  .modale{background:#fff;border-radius:20px;padding:24px;width:520px;max-width:100%;max-height:90vh;overflow:auto}
  .modale h3{font-family:Fraunces,serif;font-size:24px;margin:0 0 4px}
  .modale .sous{color:var(--gris);font-size:13px;margin-bottom:16px}
  .ligne{display:grid;grid-template-columns:80px 110px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--ligne)}
  .ligne input[type=time]{padding:8px;border:1px solid var(--ligne);border-radius:8px;font:inherit;font-size:15px}
  .ligne .src{font-size:12px;color:var(--gris)}
  .ligne .sup{background:none;border:0;color:var(--cerise);font-size:13px;font-weight:700}
  .ajout{display:flex;gap:10px;align-items:center;margin-top:12px;padding-top:12px;border-top:1px dashed var(--ligne);flex-wrap:wrap}
  .ajout select,.ajout input{padding:8px;border:1px solid var(--ligne);border-radius:8px;font:inherit;font-size:14px}
  .modale .motif{width:100%;padding:10px;border:1px solid var(--ligne);border-radius:10px;font:inherit;margin-top:16px}
  .modale .btns{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .modale .btns button{padding:10px 18px;border-radius:999px;border:1.5px solid var(--encre);background:none;font-weight:700}
  .modale .btns button.plein{background:var(--cerise);border-color:var(--cerise);color:#fff}
  .modale .err{color:var(--cerise);font-size:13px;min-height:18px;margin-top:8px}
  @media(max-width:800px){#app{grid-template-columns:1fr}aside{flex-direction:row;flex-wrap:wrap;align-items:center}aside .deco{margin-top:0;margin-left:auto}.kpis{grid-template-columns:1fr 1fr}.r{grid-template-columns:62px 1fr 1fr 64px;font-size:13px;padding:10px 12px}.r > span:nth-child(5){grid-column:1 / -1}main{padding:18px 14px}.mois b{font-size:24px;min-width:0}}
  @media print{aside,.actions,.alerte,.mois .nav{display:none !important}#app{grid-template-columns:1fr}body{background:#fff}.kpi.grand{background:#fff;color:#000;border:1px solid #ccc}.kpi.grand .g{color:#000}.liste,.kpi{border-color:#ccc}.r:not(.tete):hover{background:none}main{max-width:none;padding:0}}
</style>
</head>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyDzqTOEKAt5FP-2qK8sCN8baSF3foVgwOY",
  authDomain: "gaec-tisserand.firebaseapp.com",
  projectId: "gaec-tisserand",
  storageBucket: "gaec-tisserand.firebasestorage.app",
  messagingSenderId: "631365630632",
  appId: "1:631365630632:web:a6a1fda2582e46a447609d"
});
const auth = firebase.auth(), db = firebase.firestore();
const $ = id => document.getElementById(id);
const JOURS = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
const MOIS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const SEUIL_LONGUE = 12*60;     // journée > 12 h = à vérifier
const PRENOM = 'Lauryne';
let user = null, unsub = null, docs = [], cfg = { contratMin: 0, uid: '' };
let moisCourant = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
let jourModale = null, modifs = {}, ajouts = [], suppressions = new Set();

function hm(d){ return d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0'); }
function hmInput(d){ return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function duree(min){ const h = Math.floor(min/60), m = min%60; return m ? `${h} h ${String(m).padStart(2,'0')}` : `${h} h`; }
function cleJour(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseContrat(s){ const m = String(s).trim().match(/^(\d+)(?:[:h]\s*(\d{1,2}))?$/i); return m ? (+m[1])*60 + (+(m[2]||0)) : null; }

// ----- Matin / après-midi (même logique que l'appli salariée) -----
const PIVOT_H = 13;              // une arrivée avant 13 h compte pour le matin, sinon pour l'après-midi
const NOUVELLE_PERIODE_H = 15;   // arrivée du matin encore ouverte après 15 h = départ du matin oublié
const NOM = { matin: 'matin', aprem: 'après-midi' };
const DU = { matin: 'du matin', aprem: 'de l\'après-midi' };
function periodeDe(d){ return d.getHours() < PIVOT_H ? 'matin' : 'aprem'; }

// Analyse d'un jour : matin, après-midi, minutes, état, anomalies
function analyseJour(k, es, aujourdhui){
  const now = new Date();
  const p = { matin: { arr: null, dep: null, min: 0 }, aprem: { arr: null, dep: null, min: 0 } };
  const ano = []; let ouvert = null, enCours = null;
  for (const e of es) {
    if (e.type === 'arrivee') {
      if (ouvert) ano.push('départ ' + DU[ouvert.per] + ' non pointé');
      const per = periodeDe(e.date);
      if (p[per].arr) ano.push('plusieurs arrivées ' + DU[per]); else p[per].arr = e;
      ouvert = { e, per };
    } else if (!ouvert) {
      const per = periodeDe(e.date);
      ano.push('arrivée ' + DU[per] + ' non pointée');
      p[per].dep = e;
    } else {
      p[ouvert.per].dep = e; p[ouvert.per].min += Math.round((e.date - ouvert.e.date)/60000); ouvert = null;
    }
  }
  if (ouvert) {
    if (k === aujourdhui && (ouvert.per === 'aprem' || now.getHours() < NOUVELLE_PERIODE_H)) { enCours = ouvert.per; p[ouvert.per].min += Math.round((now - ouvert.e.date)/60000); }
    else ano.push('départ ' + DU[ouvert.per] + ' non pointé');
  }
  const minutes = p.matin.min + p.aprem.min;
  if (minutes > SEUIL_LONGUE) ano.push('journée de ' + duree(minutes));
  return { p, minutes, etat: enCours ? 'en cours' : '', enCours, ano, corrige: es.some(e => e.corrige_par || e.source === 'correction') };
}
function plage(per, enCours){
  if (!per.arr && !per.dep) return '—';
  return (per.arr ? hm(per.arr.date) : '<span class="manque">?</span>') + '<i>→</i>' + (per.dep ? hm(per.dep.date) : (enCours ? 'en cours' : '<span class="manque">?</span>'));
}

function rendre(){
  // Mémorise l'uid de la salariée dès qu'un de ses pointages existe (nécessaire pour ajouter un pointage oublié)
  if (!cfg.uid) { const p = docs.find(d => d.source === 'nfc'); if (p) { cfg.uid = p.uid; db.collection('pointage_config').doc('salariee').set({ uid: p.uid }, { merge: true }).catch(() => null); } }
  const y = moisCourant.getFullYear(), m = moisCourant.getMonth();
  $('titreMois').textContent = MOIS[m] + ' ' + y;
  $('sbPrenom').textContent = PRENOM;
  $('sbContrat').textContent = cfg.contratMin ? 'Contrat ' + duree(cfg.contratMin) + ' / mois' : 'Contrat non renseigné (Réglages)';
  const parJour = {};
  for (const d of docs) (parJour[cleJour(d.date)] ||= []).push(d);
  const auj = cleJour(new Date());
  const nbJours = new Date(y, m+1, 0).getDate();
  let total = 0, joursTrav = 0, nbAno = 0; const alertes = []; let html = '<div class="r tete"><span>Jour</span><span>Matin</span><span>Après-midi</span><span>Total jour</span><span>Remarque</span></div>';
  for (let j = nbJours; j >= 1; j--) {
    const d = new Date(y, m, j), k = cleJour(d);
    if (k > auj) continue;
    const es = parJour[k] || [];
    const we = d.getDay() === 0 || d.getDay() === 6;
    const a = analyseJour(k, es, auj);
    total += a.minutes; if (a.minutes > 0) joursTrav++;
    if (a.ano.length) { nbAno++; alertes.push({ k, txt: JOURS[d.getDay()] + ' ' + j + ' : ' + a.ano.join(', ') }); }
    const rem = a.ano.length ? '<span class="corr">' + a.ano.join(', ') + '</span>' : (a.corrige ? '<span class="info">corrigé</span>' : (we && !es.length ? '<span class="info">week-end</span>' : ''));
    html += `<div class="r${we && !es.length ? ' we' : ''}" data-jour="${k}"><span>${JOURS[d.getDay()]} ${j}</span><span class="pl">${plage(a.p.matin, a.enCours === 'matin')}</span><span class="pl">${plage(a.p.aprem, a.enCours === 'aprem')}</span><span class="tot">${a.etat === 'en cours' ? 'en cours' : (a.minutes ? duree(a.minutes) : (es.length ? '0' : '—'))}</span><span>${rem}</span></div>`;
  }
  $('liste').innerHTML = html;
  $('kTotal').textContent = duree(total);
  const reste = cfg.contratMin - total;
  const auMoins = moisCourant.getMonth() === new Date().getMonth() && y === new Date().getFullYear() ? 'au ' + new Date().getDate() + ' ' + MOIS[m].toLowerCase() : 'sur le mois';
  $('kTotalP').textContent = 'travaillées ' + auMoins + (cfg.contratMin ? (reste >= 0 ? ' · reste ' + duree(reste) + ' sur le contrat' : ' · ' + duree(-reste) + ' au-delà du contrat') : '');
  $('kBarre').style.width = cfg.contratMin ? Math.min(100, total/cfg.contratMin*100) + '%' : '0';
  $('kMoy').textContent = joursTrav ? duree(Math.round(total/joursTrav)) : '—';
  $('kJours').textContent = joursTrav;
  $('kAno').textContent = nbAno; $('kAnoBox').classList.toggle('al', nbAno > 0);
  $('alertes').innerHTML = alertes.map(a => `<div class="alerte" data-jour="${a.k}"><i></i>${a.txt}. Cliquer pour corriger.</div>`).join('');
  document.querySelectorAll('[data-jour]').forEach(el => el.onclick = () => ouvrirModale(el.dataset.jour));
}

function ecouter(){
  if (unsub) unsub();
  const debut = moisCourant, fin = new Date(moisCourant.getFullYear(), moisCourant.getMonth()+1, 1);
  unsub = db.collection('pointage').where('horodatage', '>=', debut).where('horodatage', '<', fin).orderBy('horodatage')
    .onSnapshot(snap => {
      docs = snap.docs.filter(d => d.data().horodatage).map(d => ({ id: d.id, ...d.data(), date: d.data().horodatage.toDate() }));
      rendre();
    }, err => alert('Lecture impossible : ' + err.message));
}

// ----- Corrections -----
function ouvrirModale(k){
  jourModale = k; modifs = {}; ajouts = []; suppressions.clear();
  const d = new Date(k + 'T12:00:00');
  $('mTitre').textContent = JOURS[d.getDay()] + ' ' + d.getDate() + ' ' + MOIS[d.getMonth()].toLowerCase();
  $('mMotif').value = ''; $('mErr').textContent = ''; $('aHeure').value = '';
  rendreModale(); $('voile').style.display = 'flex';
}
function rendreModale(){
  const es = docs.filter(x => cleJour(x.date) === jourModale && !suppressions.has(x.id));
  let html = es.map(e => `<div class="ligne"><b>${e.type === 'arrivee' ? 'Arrivée' : 'Départ'}</b><input type="time" value="${modifs[e.id] || hmInput(e.date)}" data-id="${e.id}"><span class="src">${NOM[periodeDe(e.date)]} · ${e.source === 'nfc' ? 'scanné' : 'saisi'}${e.corrige_par ? ' · déjà corrigé' : ''}</span><button class="sup" data-sup="${e.id}">Supprimer</button></div>`).join('');
  html += ajouts.map((a, i) => `<div class="ligne"><b>${a.type === 'arrivee' ? 'Arrivée' : 'Départ'}</b><input type="time" value="${a.heure}" disabled><span class="src">nouveau</span><button class="sup" data-aj="${i}">Retirer</button></div>`).join('');
  $('mLignes').innerHTML = html || '<div class="sous">Aucun pointage ce jour.</div>';
  $('mLignes').querySelectorAll('input[type=time]').forEach(i => i.onchange = () => modifs[i.dataset.id] = i.value);
  $('mLignes').querySelectorAll('[data-sup]').forEach(b => b.onclick = () => { suppressions.add(b.dataset.sup); rendreModale(); });
  $('mLignes').querySelectorAll('[data-aj]').forEach(b => b.onclick = () => { ajouts.splice(+b.dataset.aj, 1); rendreModale(); });
}
$('aBtn').onclick = () => { if (!$('aHeure').value) return; ajouts.push({ type: $('aType').value, heure: $('aHeure').value }); $('aHeure').value = ''; rendreModale(); };
$('mAnnuler').onclick = () => $('voile').style.display = 'none';
$('mValider').onclick = async () => {
  const motif = $('mMotif').value.trim();
  const rien = !Object.keys(modifs).length && !ajouts.length && !suppressions.size;
  if (rien) { $('voile').style.display = 'none'; return; }
  if (!motif) { $('mErr').textContent = 'Indique un motif.'; return; }
  if (!cfg.uid && ajouts.length) { $('mErr').textContent = 'Impossible d\'ajouter : aucun pointage de la salariée connu encore (son uid). Elle doit pointer une première fois.'; return; }
  const dateA = h => { const [hh, mm] = h.split(':'); const d = new Date(jourModale + 'T00:00:00'); d.setHours(+hh, +mm, 0, 0); return d; };
  const now = firebase.firestore.FieldValue.serverTimestamp();
  try {
    const lot = db.batch();
    for (const [id, h] of Object.entries(modifs)) {
      const e = docs.find(x => x.id === id); if (!e || suppressions.has(id)) continue;
      lot.update(db.collection('pointage').doc(id), { horodatage: firebase.firestore.Timestamp.fromDate(dateA(h)), corrige_par: user.uid, corrige_le: now, horodatage_origine: e.horodatage_origine || e.horodatage, motif });
    }
    for (const id of suppressions) lot.delete(db.collection('pointage').doc(id));
    for (const a of ajouts) lot.set(db.collection('pointage').doc(), { uid: cfg.uid, type: a.type, source: 'correction', horodatage: firebase.firestore.Timestamp.fromDate(dateA(a.heure)), corrige_par: user.uid, corrige_le: now, motif });
    await lot.commit();
    $('voile').style.display = 'none';
  } catch (e) { $('mErr').textContent = 'Refusé : ' + e.message; }
};

// ----- Export / impression -----
$('btnExport').onclick = () => {
  const parJour = {}; for (const d of docs) (parJour[cleJour(d.date)] ||= []).push(d);
  const lignes = [['Jour', 'Matin arrivée', 'Matin départ', 'Après-midi arrivée', 'Après-midi départ', 'Minutes jour', 'Heures jour', 'Remarque']];
  const auj = cleJour(new Date());
  for (const k of Object.keys(parJour).sort()) {
    const es = parJour[k], a = analyseJour(k, es, auj);
    const h = x => x ? hm(x.date) : '';
    lignes.push([k, h(a.p.matin.arr), h(a.p.matin.dep), h(a.p.aprem.arr), h(a.p.aprem.dep), a.minutes, (a.minutes/60).toFixed(2).replace('.', ','), a.ano.join(' ; ') + (a.corrige ? ' corrigé' : '')]);
  }
  const csv = '\ufeff' + lignes.map(l => l.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(';')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = 'pointage-' + PRENOM.toLowerCase() + '-' + cleJour(moisCourant).slice(0, 7) + '.csv'; a.click();
};
$('btnPrint').onclick = () => window.print();

// ----- Navigation / réglages -----
$('prec').onclick = () => { moisCourant = new Date(moisCourant.getFullYear(), moisCourant.getMonth()-1, 1); ecouter(); };
$('suiv').onclick = () => { moisCourant = new Date(moisCourant.getFullYear(), moisCourant.getMonth()+1, 1); ecouter(); };
document.querySelectorAll('.menu button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.menu button').forEach(x => x.classList.toggle('actif', x === b));
  $('pageMois').style.display = b.dataset.page === 'mois' ? 'block' : 'none';
  $('reglages').style.display = b.dataset.page === 'reglages' ? 'block' : 'none';
});
$('btnCfg').onclick = async () => {
  const c = parseContrat($('cfgContrat').value);
  if ($('cfgContrat').value && c === null) { $('cfgMsg').style.color = 'var(--cerise)'; $('cfgMsg').textContent = 'Format attendu : 151:40 ou 151h40'; return; }
  try {
    await db.collection('pointage_config').doc('salariee').set({ contratMin: c || 0, uid: cfg.uid || '' }, { merge: true });
    $('cfgMsg').style.color = 'var(--vert)'; $('cfgMsg').textContent = 'Enregistré.';
  } catch (e) { $('cfgMsg').style.color = 'var(--cerise)'; $('cfgMsg').textContent = e.message; }
};

async function demarrer(u){
  user = u;
  try {
    const acces = await db.collection('pointage_acces').doc(u.uid).get();
    if (!acces.exists || acces.data().role !== 'gestion') { alert('Ce compte n\'a pas accès à la gestion.'); auth.signOut(); return; }
    db.collection('pointage_config').doc('salariee').onSnapshot(s => {
      if (s.exists) cfg = { contratMin: 0, uid: '', ...s.data() };
      $('cfgContrat').value = cfg.contratMin ? Math.floor(cfg.contratMin/60) + ':' + String(cfg.contratMin%60).padStart(2, '0') : '';
      rendre();
    });
        $('login').style.display = 'none'; $('app').style.display = 'grid';
    ecouter();
  } catch (e) { alert('Connexion à la base impossible : ' + e.message); }
}

$('btnLogin').onclick = async () => {
  $('loginErr').textContent = '';
  try { await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); await auth.signInWithEmailAndPassword($('email').value.trim(), $('mdp').value); }
  catch (e) { $('loginErr').textContent = 'E-mail ou mot de passe incorrect'; }
};
$('mdp').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnLogin').click(); });
$('btnDeco').onclick = () => auth.signOut();
auth.onAuthStateChanged(u => { if (u) demarrer(u); else { if (unsub) unsub(); user = null; $('app').style.display = 'none'; $('login').style.display = 'flex'; } });
</script>
</body>
</html>
